version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
    # Do not adopt a release during the window in which a compromised or
    # yanked publish is most likely to be caught and pulled. Security
    # updates are exempt, so an advisory-driven bump is never delayed.
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - go
      - security
    # Disable regular version updates and only use Dependabot for security updates
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - build
      - security
    groups:
      github-actions-breaking:
        update-types:
          - major
      github-actions-backward-compatible:
        update-types:
          - minor
          - patch
